environment: production
environmentCode:
name: ffc-doc-alerting
namespace: ffc-doc
workstream: ffc-doc
image: ffc-doc-alerting

labels:
  component: service

appInsights:
  connectionString:

containerConfigMap:
  name: ffc-doc-alerting-config-map

containerSecret:
  name: ffc-doc-alerting-container-secret
  type: Opaque

deployment:
  minReplicas: 1
  maxReplicas: 1
  cpuThreshold: 80
  memoryThreshold: 80

container:
  requestMemory: 100Mi
  requestCpu: 100m
  limitMemory: 100Mi
  limitCpu: 100m
  messageQueueHost: namespace.servicebus.windows.net
  alertTopicAddress: ffc-doc-alerting
  alertSubscriptionAddress: ffc-doc-alert
  notifyApiKey:
  devTeamEmails:
  dwhEmails:
  sendAlerts: true

workloadIdentity: true

azureIdentity:
  clientID: not-a-real-clientID
  resourceID: not-a-real-resourceID

secretProviderClass:
  azure:
    keyvaultName: SNDFFCINFKV2001
    objects: # reading the secret from Azure Key Vault
      - objectName: appInsights-connectionString # secret name in Azure Key Vault
        objectType: secret

  secretObjects: # creating a Kubernetes secret from the Azure Key Vault secrets
    - secretName: ffc-doc-statement-receiver
      type: Opaque
      data:
        - objectName: appInsights-connectionString # secret name in Azure Key Vault
          key: APPINSIGHTS_CONNECTION_STRING # the secret key in the Kubernetes secret and use in the application